<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 5 - User Directory</title>
  <script src="users.js" defer></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 650px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
      color: #1e293b;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    button {
      padding: 0.6rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-start;
    }
    input {
      padding: 0.5rem;
      font-size: 0.95rem;
      width: 100%;
      box-sizing: border-box;
    }
    #status {
      font-size: 0.9rem;
      font-weight: 500;
      color: #64748b;
      min-height: 1.2rem;
    }
    #users-list {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .user-card {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 0.85rem 1rem;
      background-color: #f8fafc;
    }
    .user-card strong {
      display: block;
      font-size: 1.05rem;
      color: #0f172a;
    }
    .empty-message {
      color: #94a3b8;
      font-style: italic;
    }
  </style>
</head>
<body>

  <h1>User Directory</h1>

  <div class="controls">
    <button id="load-users" type="button">Load Users</button>

    <div>
      <label for="filter-input">Filter by name:</label>
      <input type="text" id="filter-input" placeholder="Type a name to filter...">
    </div>
  </div>

  <p id="status"></p>
  <ul id="users-list"></ul>

</body>
</html>
