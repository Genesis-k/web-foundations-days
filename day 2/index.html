<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Shared Header -->
  <header>
    <h1>QuickNotes</h1>
    <p class="tagline">Capture thoughts, tasks, and ideas in seconds.</p>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Write a Note</h2>
      <form action="#" method="post">
        <div>
          <label for="note-title">Title:</label>
          <input type="text" id="note-title" name="noteTitle" placeholder="e.g., PLP Study Goals">
        </div>
        <div>
          <label for="note-content">Content:</label>
          <textarea id="note-content" name="noteContent" rows="6" placeholder="Start typing your note here..."></textarea>
        </div>
        <button type="submit">Add Note</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes. Built for PLP Web Development.</p>
  </footer>

</body>
</html>
