<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 4 - Note Scratchpad</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="container">
    <div class="header-bar">
      <h1>Quick Note</h1>
      <button id="theme-toggle" type="button">Dark mode</button>
    </div>

    <form onsubmit="return false;">
      <label for="note-text">Write your note:</label>
      <textarea id="note-text" rows="8" placeholder="Type your note here (press Esc to clear)..."></textarea>
      
      <div class="status-bar">
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
      </div>

      <div class="action-bar">
        <button id="clear-btn" type="button">Clear</button>
      </div>
    </form>
  </main>

</body>
</html>
